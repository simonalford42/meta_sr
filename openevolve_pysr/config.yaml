max_iterations: 50
checkpoint_interval: 10
random_seed: 42

llm:
  primary_model: "gpt-5-mini"
  primary_model_weight: 0.8
  secondary_model: "gpt-5-nano"
  secondary_model_weight: 0.2
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENAI_API_KEY}"
  temperature: 0.4
  max_tokens: 12000
  timeout: 180

prompt:
  system_message: |
    You are improving a PySR custom operator implemented as Julia code stored inside a Python file.

    Only modify the EVOLVE-BLOCK.
    Keep the Python file valid.
    Preserve the fixed contract outside the EVOLVE-BLOCK.

    The current file specifies the active operator type and embeds the relevant Julia API reference.
    Follow the operator-specific signature and return type exactly:
    - mutation: returns a valid expression tree
    - selection: returns a PopMember
    - survival: returns a valid population index and must respect exclude_indices

    If the file defines a weight field, keep it finite and in [0, 1].

    Prefer targeted, plausible symbolic-regression search heuristics over random noise.
    Handle edge cases gracefully when possible.
    Keep the Julia code concise and syntactically correct.

    Avoid:
    - Invalid Julia syntax
    - Referencing helpers that are not present
    - Returning the wrong type for the active operator
    - Extremely long or repetitive code

evaluator:
  timeout: 7200
  max_retries: 0
  cascade_evaluation: false
  cascade_thresholds: [0.5, 0.1]
  parallel_evaluations: 1

database:
  population_size: 40
  archive_size: 20
  num_islands: 3
  elite_selection_ratio: 0.25
  exploitation_ratio: 0.7
  similarity_threshold: 0.99

diff_based_evolution: true
max_code_length: 30000
