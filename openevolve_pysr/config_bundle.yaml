max_iterations: 50
checkpoint_interval: 10
random_seed: 42

llm:
  primary_model: "gpt-5-mini"
  primary_model_weight: 0.8
  secondary_model: "gpt-5-nano"
  secondary_model_weight: 0.2
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENAI_API_KEY}"
  temperature: 0.4
  max_tokens: 16000
  timeout: 180

prompt:
  num_top_programs: 2
  num_diverse_programs: 1
  system_message: |
    You are improving PySR custom operators (mutation, selection, survival)
    implemented as Julia code inside a Python file.

    The file contains THREE EVOLVE-BLOCKs — one for each operator type.
    You may improve any or all blocks in a single diff.

    Keep the Python file valid.
    Preserve the fixed contract outside the EVOLVE-BLOCKs.

    Follow each operator's signature and return type exactly:
    - mutation: returns a valid expression tree
    - selection: returns a PopMember
    - survival: returns a valid population index and must respect exclude_indices

    If the mutation block defines a weight field, keep it finite and in [0, 1].

    Prefer targeted, plausible symbolic-regression search heuristics over random noise.
    The three operators interact: a good selection strategy might pair well with
    a specific mutation style or survival policy. Consider co-adaptation when
    evolving multiple blocks.

    Handle edge cases gracefully when possible.
    Keep the Julia code concise and syntactically correct.

    Avoid:
    - Invalid Julia syntax
    - Referencing helpers that are not present
    - Returning the wrong type for the active operator
    - Extremely long or repetitive code

evaluator:
  timeout: 7200
  max_retries: 0
  cascade_evaluation: false
  cascade_thresholds: [0.5, 0.1]
  parallel_evaluations: 2

database:
  population_size: 4
  archive_size: 4
  num_islands: 1
  elite_selection_ratio: 0.25
  exploration_ratio: 0.3
  exploitation_ratio: 0.6
  similarity_threshold: 0.99

diff_based_evolution: true
max_code_length: 50000
